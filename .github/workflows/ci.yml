name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  dry-run:
    name: dry-run check (real preprint)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run citeagle dry-run
        env:
          CITEAGLE_CONTACT_EMAIL: ci@github-actions.invalid
        run: |
          citeagle check 10.1101/2025.10.20.683396 --out /tmp/citeagle-out --no-cache

      - name: Show report
        run: |
          echo "=== report.md ==="
          cat /tmp/citeagle-out/report.md
          echo ""
          echo "=== report.json (counts) ==="
          python -c "import json; d=json.load(open('/tmp/citeagle-out/report.json')); print(json.dumps(d['counts'], indent=2)); print(f'flagged={d[\"flagged_count\"]}/{d[\"total_count\"]}')"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: citeagle-report
          path: /tmp/citeagle-out/
          retention-days: 7
