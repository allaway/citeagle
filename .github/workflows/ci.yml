name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  dry-run:
    name: dry-run check (sample .bib)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Write sample BibTeX
        run: |
          cat > /tmp/sample.bib << 'EOF'
          @article{attention2017,
            author  = {Vaswani, Ashish and Shazeer, Noam and Parmar, Niki and Uszkoreit, Jakob and Jones, Llion and Gomez, Aidan N and Kaiser, {\L}ukasz and Polosukhin, Illia},
            title   = {Attention Is All You Need},
            journal = {Advances in Neural Information Processing Systems},
            year    = {2017},
            doi     = {10.48550/arXiv.1706.03762},
          }
          @article{fakepaper2099,
            author  = {Nobody, A},
            title   = {Completely fabricated paper that does not exist},
            journal = {Journal of Imaginary Science},
            year    = {2099},
            doi     = {10.9999/fake.doi.does.not.exist},
          }
          EOF

      - name: Run citeagle dry-run
        env:
          CITEAGLE_CONTACT_EMAIL: ci@github-actions.invalid
        run: |
          citeagle check /tmp/sample.bib --out /tmp/citeagle-out --no-cache

      - name: Show report
        run: |
          echo "=== report.md ==="
          cat /tmp/citeagle-out/report.md
          echo ""
          echo "=== report.json (counts) ==="
          python -c "import json; d=json.load(open('/tmp/citeagle-out/report.json')); print(json.dumps(d['counts'], indent=2)); print(f'flagged={d[\"flagged_count\"]}/{d[\"total_count\"]}')"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: citeagle-report
          path: /tmp/citeagle-out/
          retention-days: 7
