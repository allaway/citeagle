[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "citeagle"
version = "0.1.0"
description = "Eagle-eyed citation checker for scholarly preprints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "atproto>=0.0.55",
    "typer>=0.12",
    "bibtexparser>=1.4",
    "anthropic>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "respx>=0.21", "pytest-httpx>=0.30"]

[project.scripts]
citeagle = "citeagle.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
